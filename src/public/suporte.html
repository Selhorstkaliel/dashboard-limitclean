<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LimitClean - Suporte</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <h2>LimitClean</h2>
                </div>
                <nav class="main-nav">
                    <a href="/" class="nav-item">Dashboard</a>
                    <a href="/cadastro.html" class="nav-item">Cadastro</a>
                    <a href="/usuario.html" class="nav-item">Usuário</a>
                    <a href="/suporte.html" class="nav-item active">Suporte</a>
                </nav>
            </div>
            <div class="header-right">
                <div class="user-menu">
                    <div class="user-avatar">
                        <img id="userAvatar" src="/img/default-avatar.png" alt="Avatar">
                    </div>
                    <span id="userName">Usuário</span>
                    <div class="dropdown">
                        <button class="dropdown-btn">▼</button>
                        <div class="dropdown-content">
                            <a href="/usuario.html">Configurações</a>
                            <a href="#" id="logoutBtn">Sair</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <section class="recent-section">
                <div class="section-header">
                    <h3>Central de Suporte</h3>
                    <div class="filters">
                        <input type="search" id="searchFilter" placeholder="Buscar tickets...">
                        <select id="statusFilter">
                            <option value="">Todos os Status</option>
                            <option value="ABERTO">Aberto</option>
                            <option value="EM_ANDAMENTO">Em Andamento</option>
                            <option value="RESOLVIDO">Resolvido</option>
                            <option value="FECHADO">Fechado</option>
                        </select>
                        <button class="btn btn-primary" id="newTicketBtn">
                            + Novo Ticket
                        </button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Assunto</th>
                                <th>Status</th>
                                <th>Autor</th>
                                <th>Data de Criação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTable">
                            <tr>
                                <td colspan="6" class="loading">Carregando tickets...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="pagination">
                    <!-- Pagination will be generated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- New Ticket Modal -->
    <div id="newTicketModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Novo Ticket de Suporte</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="newTicketForm">
                    <div class="input-group">
                        <label for="ticketSubject">Assunto</label>
                        <input type="text" id="ticketSubject" name="subject" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="ticketMessage">Descrição</label>
                        <textarea id="ticketMessage" name="message" rows="5" required></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <span class="btn-text">Criar Ticket</span>
                            <div class="spinner" style="display: none;"></div>
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeNewTicketModal()">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Alert container -->
    <div class="alert" id="alertMessage" style="display: none;"></div>

    <script src="/js/common.js"></script>
    <script src="/js/suporte.js"></script>
</body>
</html>
