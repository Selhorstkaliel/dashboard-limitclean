<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LimitClean - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>LimitClean</h1>
                <p>Sistema de Gestão</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required minlength="8">
                </div>
                
                <div class="input-group" id="totpGroup" style="display: none;">
                    <label for="totpToken">Código 2FA</label>
                    <input type="text" id="totpToken" name="totpToken" placeholder="000000" maxlength="6">
                </div>
                
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkmark"></span>
                        Lembrar-me
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="btn-text">Entrar</span>
                    <div class="spinner" style="display: none;"></div>
                </button>
                
                <div class="form-links">
                    <a href="#" id="forgotPassword">Esqueci minha senha</a>
                </div>
            </form>
            
            <div class="alert" id="alertMessage" style="display: none;"></div>
        </div>
    </div>
    
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
